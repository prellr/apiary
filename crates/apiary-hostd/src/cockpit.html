<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apiary Cockpit</title>
<style>
  :root { --bg:#12100d; --bg-soft:#17140f; --panel:#1d1913; --panel-2:#241f17; --line:#3a3225; --line-soft:#2c261d; --amber:#e3ad55; --amber-soft:#5b4528; --text:#f0e9dc; --dim:#aaa08f; --ok:#9ac487; --bad:#dc8474; --blue:#8aaed2; --shadow:rgba(28,20,10,.34); --sans:'Avenir Next','Segoe UI',ui-sans-serif,system-ui,-apple-system,sans-serif; --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
  * { box-sizing:border-box; margin:0; }
  html { background:var(--bg); scroll-behavior:smooth; }
  body { background:radial-gradient(circle at 72% -20%,#2a2114 0,transparent 38%),var(--bg); color:var(--text); font:15px/1.55 var(--sans); height:100dvh; display:flex; flex-direction:column; }
  button,input,textarea,select { font:inherit; }
  button { transition:background-color .18s ease,border-color .18s ease,color .18s ease,transform .12s ease; }
  button:active { transform:translateY(1px); }
  :focus-visible { outline:3px solid rgba(227,173,85,.48); outline-offset:2px; }
  .skip { position:fixed; left:12px; top:-60px; z-index:10; background:var(--amber); color:var(--bg); padding:8px 12px; border-radius:6px; }
  .skip:focus { top:12px; }
  header { min-height:58px; padding:10px 18px; border-bottom:1px solid var(--line-soft); display:flex; align-items:center; gap:14px; }
  .brand { display:flex; align-items:baseline; gap:12px; min-width:0; }
  header h1 { font:700 17px/1 var(--mono); color:var(--amber); letter-spacing:.11em; }
  header .sub { color:var(--dim); font-size:13px; white-space:nowrap; }
  .header-spacer { flex:1; }
  .header-actions { display:flex; align-items:center; gap:8px; }
  .chip { appearance:none; background:transparent; font:12px/1.2 var(--sans); padding:6px 10px; border-radius:7px; border:1px solid var(--line); color:var(--dim); cursor:default; }
  button.chip { cursor:pointer; }
  button.chip:hover { color:var(--text); border-color:var(--amber-soft); background:var(--panel); }
  .chip.ok { color:var(--ok); border-color:#4c6840; }
  .chip.bad { color:var(--bad); border-color:#78483e; }
  .host-menu { position:relative; }
  .host-menu > summary { list-style:none; color:var(--dim); border:1px solid var(--line); border-radius:7px; padding:6px 10px; cursor:pointer; font-size:12px; transition:background-color .18s ease,border-color .18s ease,color .18s ease,box-shadow .18s ease; }
  .host-menu > summary::-webkit-details-marker { display:none; }
  .host-menu > summary:hover { color:var(--text); border-color:var(--amber-soft); background:var(--panel); }
  .host-menu .host-menu-open { display:none; }
  .host-menu[open] > summary { color:var(--text); border-color:var(--amber); background:var(--panel-2); box-shadow:inset 0 -2px var(--amber); }
  .host-menu[open] .host-menu-closed { display:none; }
  .host-menu[open] .host-menu-open { display:inline; }
  .host-popover { position:absolute; right:0; top:38px; z-index:5; width:min(440px,calc(100vw - 24px)); max-height:calc(100dvh - 76px); overflow:auto; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--panel-2); box-shadow:0 18px 45px var(--shadow); display:grid; gap:8px; }
  .host-popover .chip { text-align:left; width:100%; }
  .backend-control { border-top:1px solid var(--line); margin-top:3px; padding-top:11px; display:grid; gap:9px; }
  .backend-heading { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .backend-heading strong { font-size:13px; }
  .backend-current { color:var(--dim); font-size:11px; text-align:right; overflow-wrap:anywhere; }
  .backend-actions { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:7px; }
  .backend-actions select { width:100%; }
  .backend-secondary { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .backend-secondary .btn { padding:6px 9px; font-size:11px; }
  .backend-message { min-height:18px; color:var(--dim); font-size:11px; }
  .backend-add { border-top:1px solid var(--line-soft); padding-top:8px; }
  .backend-add > summary { color:var(--amber); font-size:11px; }
  .backend-form { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin-top:10px; }
  .backend-form .wide { grid-column:1 / -1; }
  .backend-form input { width:100%; }
  .backend-form .btn { justify-self:start; }
  .backend-managed { color:var(--dim); font-size:11px; border-top:1px solid var(--line-soft); padding-top:8px; }
  #unlockbar,#keybar { display:none; padding:12px 18px; border-bottom:1px solid var(--line); background:var(--panel); align-items:center; gap:10px; flex-wrap:wrap; }
  #unlockbar input { width:min(320px,100%); }
  #keybar input { width:min(460px,100%); }
  main { flex:1; display:flex; min-height:0; }
  #side { display:flex; flex-direction:column; flex:0 0 280px; border-right:1px solid var(--line-soft); background:rgba(18,16,13,.72); }
  .side-actions { padding:14px 12px 6px; display:grid; gap:7px; }
  .side-action { width:100%; text-align:left; border:1px solid transparent; background:transparent; color:var(--dim); border-radius:8px; padding:9px 10px; cursor:pointer; }
  .side-action:hover { background:var(--panel); color:var(--text); }
  .side-action.primary { color:var(--bg); background:var(--amber); font-weight:650; }
  .side-action.primary:hover { background:#efbd69; }
  .roster-label { padding:14px 16px 4px; color:var(--dim); font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
  #roster { flex:1; overflow-y:auto; padding:8px 10px 18px; }
  .agent { display:block; width:100%; text-align:left; color:var(--text); background:transparent; padding:11px 12px; border:1px solid transparent; border-radius:9px; margin-bottom:5px; cursor:pointer; }
  .agent:hover { background:var(--panel); }
  .agent.sel { border-color:var(--amber-soft); background:var(--panel); box-shadow:inset 3px 0 var(--amber); }
  .agent .nm { color:var(--text); font-weight:650; display:flex; align-items:center; gap:6px; }
  .agent .np { color:var(--dim); font:11px/1.4 var(--mono); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge { font:700 9px/1 var(--sans); padding:3px 5px; border-radius:4px; border:1px solid; text-transform:uppercase; letter-spacing:.04em; }
  .rat { color:var(--ok); border-color:#4c6840; } .unrat { color:var(--bad); border-color:#78483e; }
  .live { color:var(--blue); border-color:#465d75; }
  #panel { flex:1; display:flex; flex-direction:column; min-width:0; }
  nav { display:flex; gap:1px; overflow-x:auto; border-bottom:1px solid var(--line-soft); padding:0 14px; background:rgba(18,16,13,.46); }
  nav button { background:none; border:none; color:var(--dim); padding:12px 11px 10px; cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; font-size:13px; }
  nav button:hover { color:var(--text); }
  nav button.sel { color:var(--amber); border-bottom-color:var(--amber); }
  #content { flex:1; overflow-y:auto; padding:24px clamp(20px,3vw,42px) 48px; }
  #content > * { max-width:1080px; }
  pre { background:var(--bg-soft); border:1px solid var(--line-soft); border-radius:8px; padding:14px; overflow-x:auto; font:12px/1.55 var(--mono); white-space:pre-wrap; word-break:break-word; }
  code,.mono { font-family:var(--mono); }
  .entry { border-left:3px solid var(--line); padding:8px 12px; margin-bottom:8px; }
  .entry b { color:var(--amber); } .entry .meta,.meta { color:var(--dim); font-size:12px; }
  .help { color:var(--dim); font-size:13px; margin:4px 0 13px; max-width:66ch; text-wrap:pretty; }
  .help b { color:var(--text); }
  .section { border:1px solid var(--line-soft); border-radius:11px; padding:17px 18px 20px; margin-bottom:16px; background:rgba(29,25,19,.9); }
  .section h3 { color:var(--text); font-size:15px; font-weight:650; margin-bottom:3px; }
  .kv { display:flex; gap:12px; font-size:13px; margin:5px 0; }
  .kv .k { color:var(--dim); min-width:145px; }
  .kv .v { word-break:break-word; }
  .page-head { margin:0 0 22px; }
  .eyebrow { color:var(--amber); font-size:11px; font-weight:750; letter-spacing:.11em; text-transform:uppercase; margin-bottom:4px; }
  .page-title { font-size:clamp(25px,3vw,36px); line-height:1.1; letter-spacing:-.025em; text-wrap:balance; }
  .page-lede { color:var(--dim); max-width:62ch; margin-top:8px; }
  .metrics { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:16px; }
  .metric { padding:14px; background:var(--panel); border-top:2px solid var(--line); border-radius:4px 4px 9px 9px; }
  .metric .label { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
  .metric .value { display:block; margin-top:4px; font-size:17px; font-weight:650; }
  .quick-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-bottom:18px; }
  .quick { text-align:left; padding:15px; background:transparent; color:var(--text); border:1px solid var(--line); border-radius:9px; cursor:pointer; }
  .quick:hover { border-color:var(--amber-soft); background:var(--panel); }
  .quick b { display:block; margin-bottom:3px; }
  .quick span { color:var(--dim); font-size:12px; }
  .catalog-list { border-top:1px solid var(--line-soft); margin-top:12px; }
  .catalog-item { padding:15px 2px; border-bottom:1px solid var(--line-soft); }
  .catalog-item h4 { font-size:14px; font-weight:650; }
  .catalog-item p { color:var(--dim); font-size:12px; max-width:62ch; margin-top:3px; }
  .catalog-item > .row { margin-top:9px; }
  .catalog-meta { display:flex; gap:8px; align-items:center; margin-top:7px; color:var(--dim); font-size:11px; }
  .risk { color:var(--amber); }
  .source-list { border-top:1px solid var(--line-soft); margin-top:12px; }
  .source-item { padding:16px 2px 17px; border-bottom:1px solid var(--line-soft); }
  .source-head { display:grid; grid-template-columns:minmax(150px,.7fr) minmax(240px,1.3fr) auto; gap:18px; align-items:start; }
  .source-name { font-weight:700; font-size:15px; }
  .source-role { color:var(--dim); font-size:11px; margin-top:2px; text-transform:uppercase; letter-spacing:.06em; }
  .source-detail { color:var(--dim); font-size:12px; }
  .source-detail b { color:var(--text); font-weight:600; }
  .source-state { justify-self:end; text-align:right; }
  .state { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; }
  .state::before { content:''; width:7px; height:7px; border-radius:50%; background:var(--line); }
  .state.ready { color:var(--ok); } .state.ready::before { background:var(--ok); }
  .state.configured { color:var(--blue); } .state.configured::before { background:var(--blue); }
  .state.unavailable { color:var(--bad); } .state.unavailable::before { background:var(--bad); }
  .source-item details { margin-top:10px; }
  .connection-form { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px 16px; padding:14px 0 2px; }
  .connection-form .wide { grid-column:1 / -1; }
  .connection-actions { grid-column:1 / -1; display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:2px; }
  .route-line { display:grid; grid-template-columns:minmax(180px,320px) auto 1fr; gap:8px; align-items:center; margin-top:10px; }
  .attention { border:1px solid var(--amber-soft); border-left:4px solid var(--amber); border-radius:9px; background:linear-gradient(90deg,rgba(91,69,40,.28),rgba(29,25,19,.82)); padding:15px 16px; margin-bottom:18px; }
  .attention h2 { font-size:16px; margin-bottom:4px; }
  .setup { max-width:780px!important; margin:clamp(8px,4vh,40px) auto; }
  .setup-card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:clamp(22px,4vw,38px); box-shadow:0 24px 70px var(--shadow); }
  .setup-steps { display:flex; gap:8px; margin:20px 0 26px; }
  .setup-step { flex:1; height:4px; border-radius:2px; background:var(--line); }
  .setup-step.done,.setup-step.current { background:var(--amber); }
  .setup h2 { font-size:26px; line-height:1.15; letter-spacing:-.02em; }
  .setup .field { margin-top:16px; }
  .field { display:grid; gap:6px; color:var(--text); font-size:13px; font-weight:600; }
  .field small { color:var(--dim); font-weight:400; }
  .technical { border-top:1px solid var(--line-soft); margin-top:15px; padding-top:10px; }
  .technical > summary { color:var(--dim); }
  /* Reference material that must be reachable without dominating the form it explains. Closed by
     default: the rules matter once, the form matters every time. */
  .fold { border-top:1px solid var(--line); margin-top:10px; padding-top:8px; }
  .fold > summary { color:var(--dim); font-size:11px; cursor:pointer; letter-spacing:.04em; }
  .fold > summary:hover { color:var(--text); }
  .fold pre { margin:8px 0 4px; font-size:11px; }
  .fold .help { margin-top:6px; }
  /* Empty state. `kv` was wrong for this: its 150px label column left a gap wide enough to read as a
     broken row rather than as "nothing here yet". */
  .none { color:var(--dim); font-size:12px; font-style:italic; margin:6px 0; }
  /* One entry per line, name first. The old single-span row put name, kind and caps JSON in one
     undifferentiated string, so nothing was scannable. */
  .lib { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; padding:5px 0; border-bottom:1px solid var(--line); }
  .lib:last-child { border-bottom:none; }
  .lib b { color:var(--amber); }
  .lib code { color:var(--dim); font-size:11px; word-break:break-all; }
  .lib .spacer { flex:1; }
  .bar { height:8px; background:var(--bg); border:1px solid var(--line); border-radius:4px; overflow:hidden; margin:8px 0; max-width:420px; }
  .bar div { height:100%; background:var(--ok); }
  .bar div.hot { background:var(--bad); }
  #runbox { display:flex; gap:8px; margin-bottom:8px; }
  #task { flex:1; background:var(--panel); border:1px solid var(--line); border-radius:9px; color:var(--text); padding:12px; resize:vertical; min-height:84px; }
  #go { background:var(--amber); color:var(--bg); border:none; border-radius:8px; padding:0 24px; font-weight:700; cursor:pointer; }
  #go:disabled { opacity:.4; }
  .ev { padding:5px 12px; margin-bottom:5px; border-left:3px solid var(--line); font-size:13px; }
  .ev.step { border-color:var(--blue); color:var(--blue); }
  .ev.tool { border-color:var(--amber); color:var(--amber); }
  .ev.text { border-color:var(--ok); white-space:pre-wrap; }
  .ev.err  { border-color:var(--bad); color:var(--bad); }
  .ev.meta { border-color:var(--line); color:var(--dim); font-size:11px; }
  .empty { color:var(--dim); padding:24px 12px; text-align:center; }
  .btn { background:transparent; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 13px; cursor:pointer; }
  .btn:hover { border-color:var(--amber-soft); background:var(--panel-2); }
  .btn.solid { background:var(--amber); color:var(--bg); font-weight:700; border-color:var(--amber); }
  .btn.solid:hover { background:#efbd69; }
  .btn.danger { color:var(--bad); border-color:var(--bad); }
  .btn:disabled { opacity:.4; }
  #med { width:100%; min-height:360px; background:var(--bg-soft); border:1px solid var(--line); border-radius:8px; color:var(--text); padding:14px; font:12px/1.55 var(--mono); resize:vertical; }
  .row { display:flex; gap:8px; align-items:center; margin:10px 0; flex-wrap:wrap; }
  input,select,textarea { background:var(--bg-soft); border:1px solid var(--line); border-radius:8px; color:var(--text); padding:9px 11px; min-width:0; }
  input::placeholder,textarea::placeholder { color:#756d60; }
  .section textarea { width:100%; resize:vertical; }
  textarea.address-list { width:100%; min-height:8.5rem; padding:13px 14px; font:13px/1.65 var(--mono); resize:vertical; }
  .grow { flex:1; min-width:160px; }
  details { margin:8px 0; }
  summary { color:var(--amber); cursor:pointer; font-size:12px; }
  .chan { padding:6px 10px; border:1px solid var(--line); border-radius:6px; margin:4px 0; cursor:pointer; font-size:12px; }
  .chan:hover { border-color:var(--amber); }
  .msg { border-left:3px solid var(--line); padding:4px 10px; margin:4px 0; font-size:12px; }
  .msg .who { color:var(--blue); }
  .msg.mine .who { color:var(--amber); }
  @media (max-width:1050px) {
    header .sub { display:none; }
    #side { flex-basis:240px; }
    nav { flex-wrap:wrap; padding:0 8px; }
    nav button { padding:9px 8px 7px; font-size:12px; }
    .metrics { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .quick-grid { grid-template-columns:1fr; }
  }
  @media (max-width:760px) {
    header { align-items:flex-start; }
    .header-actions { flex-wrap:wrap; justify-content:flex-end; }
    main { display:block; overflow:auto; }
    #side { width:100%; max-height:260px; border-right:none; border-bottom:1px solid var(--line); }
    #panel { min-height:520px; }
    .metrics { grid-template-columns:1fr; }
    .kv { display:block; }
    .kv .k { display:block; min-width:0; }
    .source-head { grid-template-columns:1fr; gap:6px; }
    .source-state { justify-self:start; text-align:left; }
    .connection-form { grid-template-columns:1fr; }
    .connection-form .wide,.connection-actions { grid-column:1; }
    .route-line { grid-template-columns:1fr; }
    .backend-form { grid-template-columns:1fr; }
    .backend-form .wide { grid-column:1; }
  }
</style>
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<header>
  <div class="brand"><h1>APIARY</h1><span class="sub">portable agents you govern</span></div>
  <span class="header-spacer"></span>
  <div class="header-actions">
    <button class="chip" id="c-model" title="model provider status">Model</button>
    <button class="chip bad" id="c-lock" title="keystore lock state">…</button>
    <details class="host-menu">
      <summary id="host-status-toggle" aria-controls="host-status-panel"><span class="host-menu-closed">Host status</span><span class="host-menu-open">Close host status</span></summary>
      <div class="host-popover" id="host-status-panel" role="region" aria-labelledby="host-status-toggle">
        <span class="chip" id="c-ver" title="host version">…</span>
        <span class="chip" id="c-home" title="state directory">State directory</span>
        <span class="chip" id="c-auth" title="host authentication mode">Authentication</span>
        <button class="chip" id="c-keytool" title="npub ⇄ hex converter">Key converter</button>
        <div id="desktop-backend" hidden></div>
      </div>
    </details>
  </div>
</header>
<div id="unlockbar">
  <span class="meta" id="u-help">passphrase unlocks the NIP-49 keystore for this session — needed to run, ratify, found, post, seal:</span>
  <input id="u-pass" type="password" placeholder="workspace passphrase" aria-label="Workspace passphrase">
  <label class="meta" id="u-remember-row"><input id="u-remember" type="checkbox" checked> remember in macOS Keychain</label>
  <button class="btn solid" id="u-go">Unlock</button>
  <button class="btn" id="u-lock" title="forget the passphrase; reads keep working">Lock</button>
  <button class="btn" id="u-forget" title="remove the saved passphrase from macOS Keychain">Forget automatic unlock</button>
  <span class="meta" id="u-status" role="status" aria-live="polite"></span>
</div>
<div id="keybar">
  <span class="meta">accepts npub or 64-char hex:</span>
  <input id="k-in" placeholder="npub1… or hex" aria-label="Public key">
  <button class="btn" id="k-go">Convert</button>
  <span class="meta" id="k-out" style="user-select:all"></span>
</div>
<main>
  <aside id="side" aria-label="Agent navigation">
    <div class="side-actions">
      <button class="side-action primary" id="foundtoggle">New agent</button>
      <button class="side-action" id="managerstoggle">People &amp; access</button>
      <button class="side-action" id="libtoggle">Integrations</button>
      <button class="side-action" id="importtoggle">Import agent</button>
    </div>
    <div class="roster-label">Agents</div>
    <div id="roster"><div class="empty">loading…</div></div>
  </aside>
  <div id="panel">
    <nav aria-label="Agent sections">
      <button data-tab="overview" class="sel" aria-current="page">Overview</button>
      <button data-tab="run">Tasks</button>
      <button data-tab="log">Activity</button>
      <button data-tab="inference">Inference</button>
      <button data-tab="manifest">Configuration</button>
      <button data-tab="buzz">Workspace</button>
      <button data-tab="connectors">Capabilities</button>
      <button data-tab="skills">Skills</button>
      <button data-tab="routines">Automations</button>
      <button data-tab="creds">Developer</button>
    </nav>
    <div id="content"><div class="empty">select an agent</div></div>
  </div>
</main>
<script src="/app.js"></script>
</body>
</html>
