<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apiary Cockpit</title>
<style>
  :root { --bg:#14120e; --panel:#1e1a14; --line:#38301f; --amber:#e8b04b; --text:#e8e0cf; --dim:#8f8570; --ok:#8fc07a; --bad:#d07a6a; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.5 ui-monospace,'SF Mono',Menlo,monospace; height:100vh; display:flex; flex-direction:column; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:12px; }
  header h1 { font-size:16px; color:var(--amber); letter-spacing:.08em; }
  header span { color:var(--dim); font-size:12px; }
  main { flex:1; display:flex; min-height:0; }
  #roster { width:290px; border-right:1px solid var(--line); overflow-y:auto; padding:8px; }
  .agent { padding:10px; border:1px solid var(--line); border-radius:6px; margin-bottom:8px; cursor:pointer; }
  .agent:hover, .agent.sel { border-color:var(--amber); background:var(--panel); }
  .agent .nm { color:var(--amber); }
  .agent .np { color:var(--dim); font-size:11px; word-break:break-all; }
  .badge { font-size:10px; padding:1px 7px; border-radius:9px; border:1px solid; margin-left:6px; }
  .rat { color:var(--ok); border-color:var(--ok); } .unrat { color:var(--bad); border-color:var(--bad); }
  #panel { flex:1; display:flex; flex-direction:column; min-width:0; }
  nav { display:flex; gap:2px; border-bottom:1px solid var(--line); padding:0 10px; }
  nav button { background:none; border:none; color:var(--dim); padding:9px 14px; cursor:pointer; font:inherit; border-bottom:2px solid transparent; }
  nav button.sel { color:var(--amber); border-bottom-color:var(--amber); }
  #content { flex:1; overflow-y:auto; padding:14px 18px; }
  pre { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px; overflow-x:auto; font-size:12px; white-space:pre-wrap; word-break:break-word; }
  .entry { border-left:3px solid var(--line); padding:6px 12px; margin-bottom:8px; }
  .entry b { color:var(--amber); } .entry .meta { color:var(--dim); font-size:11px; }
  #runbox { display:flex; gap:8px; margin-bottom:14px; }
  #task { flex:1; background:var(--panel); border:1px solid var(--line); border-radius:6px; color:var(--text); padding:10px; font:inherit; resize:vertical; min-height:60px; }
  #go { background:var(--amber); color:#14120e; border:none; border-radius:6px; padding:0 22px; font:inherit; font-weight:700; cursor:pointer; }
  #go:disabled { opacity:.4; }
  .ev { padding:5px 12px; margin-bottom:5px; border-left:3px solid var(--line); font-size:13px; }
  .ev.step { border-color:#7aa2d0; color:#7aa2d0; }
  .ev.tool { border-color:var(--amber); color:var(--amber); }
  .ev.text { border-color:var(--ok); white-space:pre-wrap; }
  .ev.err  { border-color:var(--bad); color:var(--bad); }
  .ev.meta { border-color:var(--line); color:var(--dim); font-size:11px; }
  .empty { color:var(--dim); padding:30px; text-align:center; }
</style>
</head>
<body>
<header><h1>APIARY</h1><span>portable agents · self-owned keys · signed history</span></header>
<main>
  <div id="roster"><div class="empty">loading…</div></div>
  <div id="panel">
    <nav>
      <button data-tab="run" class="sel">Run</button>
      <button data-tab="log">Log</button>
      <button data-tab="manifest">Manifest</button>
    </nav>
    <div id="content"><div class="empty">select an agent</div></div>
  </div>
</main>
<script>
let sel = null, tab = 'run', agents = [];

async function j(url, opts) { const r = await fetch(url, opts); return r.json(); }

async function loadRoster() {
  const d = await j('/api/agents');
  agents = d.agents || [];
  const el = document.getElementById('roster');
  el.innerHTML = '';
  if (!agents.length) el.innerHTML = '<div class="empty">no agents in this keystore</div>';
  for (const a of agents) {
    const div = document.createElement('div');
    div.className = 'agent' + (sel === a.npub ? ' sel' : '');
    div.innerHTML = `<div class="nm">${a.name || '(unnamed)'}<span class="badge ${a.ratified ? 'rat' : 'unrat'}">${a.ratified ? 'ratified' : 'unratified'}</span></div>
      <div class="np">${a.npub}</div><div class="np">${a.log_entries} log entries</div>`;
    div.onclick = () => { sel = a.npub; render(); loadRoster(); };
    el.appendChild(div);
  }
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('sel', x === b));
  render();
});

async function render() {
  const c = document.getElementById('content');
  if (!sel) { c.innerHTML = '<div class="empty">select an agent</div>'; return; }
  if (tab === 'manifest') {
    const d = await j(`/api/agents/${sel}/manifest`);
    c.innerHTML = `<div class="entry"><b>sha256</b> <span class="meta">${d.manifest_sha256}</span> — ${d.ratified ? 'ratified' : '<span style="color:var(--bad)">NOT ratified (amendment pending)</span>'}</div><pre></pre>`;
    c.querySelector('pre').textContent = d.yaml;
  } else if (tab === 'log') {
    const d = await j(`/api/agents/${sel}/log?tail=100`);
    const chain = d.chain.valid ? `chain valid · ${d.chain.entries} entries` : `<span style="color:var(--bad)">CHAIN BROKEN: ${d.chain.error}</span>`;
    c.innerHTML = `<div class="entry"><b>signed log</b> <span class="meta">${chain}</span></div>` +
      (d.entries || []).slice().reverse().map(e => {
        const b = e.body || {};
        const cost = b.cost ? ` · ${b.cost.input_tokens}in/${b.cost.output_tokens}out` : '';
        const harness = b.harness ? ` · ${b.harness}` : '';
        return `<div class="entry"><b>${b.action}</b> → ${b.outcome}<div class="meta">${new Date(e.at * 1000).toLocaleString()}${b.model ? ' · ' + b.model : ''}${harness}${cost}<br>${e.id}</div></div>`;
      }).join('');
  } else {
    c.innerHTML = `<div id="runbox"><textarea id="task" placeholder="task for this agent…"></textarea><button id="go">RUN</button></div><div id="events"></div>`;
    document.getElementById('go').onclick = runTask;
  }
}

function ev(cls, html) {
  const d = document.createElement('div');
  d.className = 'ev ' + cls;
  d.innerHTML = html;
  document.getElementById('events').prepend(d);
}

async function runTask() {
  const task = document.getElementById('task').value.trim();
  if (!task) return;
  const go = document.getElementById('go');
  go.disabled = true;
  document.getElementById('events').innerHTML = '';
  try {
    const resp = await fetch(`/api/agents/${sel}/run`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ task }),
    });
    if (!resp.ok) { ev('err', 'refused: ' + ((await resp.json()).error || resp.status)); go.disabled = false; return; }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const frame = buf.slice(0, i); buf = buf.slice(i + 2);
        const line = frame.split('\n').find(l => l.startsWith('data:'));
        if (!line) continue;
        let e; try { e = JSON.parse(line.slice(5)); } catch { continue; }
        switch (e.type) {
          case 'RUN_STARTED': ev('meta', `run started · ${e.runId}`); break;
          case 'STEP_STARTED': ev('step', `⚙ ${e.stepName}`); break;
          case 'TOOL_CALL_START': ev('tool', `⚒ tool: ${e.toolCallName}`); break;
          case 'TOOL_CALL_ARGS': ev('meta', `args ${e.delta}`); break;
          case 'TOOL_CALL_END': ev(e.ok ? 'tool' : 'err', `⚒ ${e.toolCallId} ${e.ok ? 'ok' : 'FAILED'} — ${e.detail}`); break;
          case 'TEXT_MESSAGE_CONTENT': ev('text', e.delta.replace(/</g, '&lt;')); break;
          case 'CUSTOM': if (e.name === 'apiary.checkpoint') ev('meta', `✓ signed checkpoint ${e.value.log_event} · ${e.value.model} · ${e.value.input_tokens}in/${e.value.output_tokens}out`); break;
          case 'RUN_FINISHED': ev('meta', 'run finished'); loadRoster(); break;
          case 'RUN_ERROR': ev('err', e.message); break;
        }
      }
    }
  } catch (err) { ev('err', String(err)); }
  go.disabled = false;
}

loadRoster();
</script>
</body>
</html>
