<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to Apiary</title>
<style>
  :root { --bg:#12100d; --panel:#1d1913; --line:#3a3225; --amber:#e3ad55; --text:#f0e9dc; --dim:#aaa08f; --bad:#dc8474; --sans:'Avenir Next','Segoe UI',ui-sans-serif,system-ui,-apple-system,sans-serif; --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
  * { box-sizing:border-box; margin:0; }
  html,body { min-height:100%; }
  body { background:radial-gradient(circle at 68% -20%,#2a2114 0,transparent 40%),var(--bg); color:var(--text); font:16px/1.55 var(--sans); display:grid; place-items:center; padding:24px; }
  main { width:min(480px,100%); }
  .brand { color:var(--amber); font:700 18px/1 var(--mono); letter-spacing:.12em; margin-bottom:24px; }
  .card { border:1px solid var(--line); border-radius:14px; background:rgba(29,25,19,.94); padding:clamp(26px,7vw,42px); box-shadow:0 28px 80px rgba(20,14,8,.45); }
  .eyebrow { color:var(--amber); font-size:11px; font-weight:750; letter-spacing:.11em; text-transform:uppercase; margin-bottom:7px; }
  h1 { font-size:clamp(28px,7vw,40px); line-height:1.08; letter-spacing:-.03em; }
  p { color:var(--dim); margin-top:14px; max-width:40ch; }
  button { width:100%; margin-top:26px; border:1px solid var(--amber); border-radius:9px; padding:12px 18px; background:var(--amber); color:var(--bg); font:700 15px/1.3 var(--sans); cursor:pointer; }
  button:hover { background:#efbd69; }
  button:disabled { opacity:.55; cursor:wait; }
  button:focus-visible { outline:3px solid rgba(227,173,85,.48); outline-offset:3px; }
  #status { min-height:24px; color:var(--dim); font-size:13px; margin-top:13px; }
  #status.bad { color:var(--bad); }
</style>
</head>
<body>
<main>
  <div class="brand">APIARY</div>
  <section class="card" aria-labelledby="title">
    <div class="eyebrow">Private host</div>
    <h1 id="title">Authentication required</h1>
    <p>Use an approved Nostr identity to open this Apiary workspace.</p>
    <button id="signin" type="button">Sign in with Nostr</button>
    <div id="status" role="status" aria-live="polite"></div>
  </section>
</main>
<script src="/signin.js"></script>
</body>
</html>
