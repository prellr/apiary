<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to Apiary</title>
<style>
  :root { color-scheme:dark; --bg:#101417; --bg-deep:#0c1012; --panel:#1b2125; --panel-2:#22292e; --line:#3b464d; --amber:#d4a24e; --on-accent:#17120a; --text:#f3f5f6; --dim:#b5bdc2; --bad:#e18a7d; --shadow:rgba(4,8,11,.42); --focus:rgba(212,162,78,.42); --sans:'Avenir Next','Segoe UI',ui-sans-serif,system-ui,-apple-system,sans-serif; --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
  * { box-sizing:border-box; margin:0; }
  html,body { min-height:100%; }
  body { background:radial-gradient(circle at 70% -22%,rgba(212,162,78,.09) 0,transparent 36%),linear-gradient(180deg,var(--bg),var(--bg-deep)); color:var(--text); font:16px/1.58 var(--sans); display:grid; place-items:center; padding:24px; }
  main { width:min(520px,100%); }
  .brand { color:var(--amber); font:700 18px/1 var(--mono); letter-spacing:.12em; margin-bottom:24px; }
  .card { border:1px solid var(--line); border-radius:14px; background:var(--panel); padding:clamp(28px,7vw,44px); box-shadow:0 28px 80px var(--shadow); }
  .eyebrow { display:flex; align-items:center; gap:8px; color:var(--dim); font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; margin-bottom:8px; }
  .eyebrow::before { content:''; width:20px; height:2px; background:var(--amber); border-radius:1px; }
  h1 { font-size:clamp(28px,7vw,40px); line-height:1.08; letter-spacing:-.03em; }
  p { color:var(--dim); margin-top:14px; max-width:40ch; }
  button { width:100%; margin-top:26px; border:1px solid var(--amber); border-radius:9px; padding:13px 18px; background:var(--amber); color:var(--on-accent); font:700 15px/1.3 var(--sans); cursor:pointer; transition:filter .18s ease,transform .12s ease,border-color .18s ease,background-color .18s ease; }
  button:hover { filter:brightness(1.08); }
  button:active { transform:translateY(1px); }
  button:disabled { opacity:.55; cursor:wait; }
  button:focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
  button.secondary { margin-top:10px; background:transparent; color:var(--text); border-color:var(--line); }
  button.secondary:hover { background:var(--panel-2); border-color:var(--amber); filter:none; }
  #status { min-height:24px; color:var(--dim); font-size:13px; margin-top:13px; }
  #status.bad { color:var(--bad); }
  #workspace-switcher { border-top:1px solid var(--line); margin-top:22px; padding-top:22px; }
  #workspace-switcher label { display:block; color:var(--dim); font-size:13px; margin-bottom:7px; }
  #workspace-switcher select { width:100%; border:1px solid var(--line); border-radius:9px; padding:12px 36px 12px 13px; background:var(--panel-2); color:var(--text); font:500 14px/1.3 var(--sans); }
  #workspace-switcher button { margin-top:10px; }
  #desktop-auth { margin-top:22px; }
  #desktop-auth label { display:block; color:var(--dim); font-size:13px; margin-bottom:7px; }
  #desktop-auth select { width:100%; border:1px solid var(--line); border-radius:9px; padding:12px 36px 12px 13px; background:var(--panel-2); color:var(--text); font:500 14px/1.3 var(--sans); }
  #desktop-auth button { margin-top:10px; }
  #remote-signer { border-top:1px solid var(--line); margin-top:22px; padding-top:22px; }
  #remote-signer summary { color:var(--text); cursor:pointer; font-weight:700; }
  #remote-signer label { display:block; color:var(--dim); font-size:13px; margin-top:14px; margin-bottom:7px; }
  #remote-signer input { width:100%; border:1px solid var(--line); border-radius:9px; padding:12px 13px; background:var(--panel-2); color:var(--text); font:500 14px/1.3 var(--mono); }
  #remote-signer small { display:block; color:var(--dim); margin-top:8px; line-height:1.45; }
  @media (prefers-color-scheme:light) {
    :root { color-scheme:light; --bg:#f3f5f6; --bg-deep:#e9edef; --panel:#fff; --panel-2:#edf1f2; --line:#b9c3c9; --amber:#855707; --on-accent:#fff; --text:#172027; --dim:#52616b; --bad:#a84236; --shadow:rgba(38,50,57,.16); --focus:rgba(133,87,7,.32); }
    body { background:radial-gradient(circle at 70% -22%,rgba(133,87,7,.07) 0,transparent 36%),linear-gradient(180deg,var(--bg),var(--bg-deep)); }
  }
</style>
</head>
<body>
<main>
  <div class="brand">APIARY</div>
  <section class="card" aria-labelledby="title">
    <div class="eyebrow">Private host</div>
    <h1 id="title">Authentication required</h1>
    <p>Use an approved Nostr identity to open this Apiary workspace.</p>
    <section id="desktop-auth" hidden aria-labelledby="desktop-manager-label">
      <label id="desktop-manager-label" for="desktop-manager">Continue as</label>
      <select id="desktop-manager"></select>
      <button id="desktop-continue" type="button">Continue in Apiary</button>
    </section>
    <button id="signin" type="button">Sign in with Nostr</button>
    <div id="status" role="status" aria-live="polite"></div>
    <details id="remote-signer">
      <summary>Use a remote signer (NIP-46)</summary>
      <label for="bunker-uri">Remote signer connection</label>
      <input id="bunker-uri" type="password" autocomplete="off" spellcheck="false" placeholder="bunker://…">
      <small>Paste the bunker connection from your signer. Apiary keeps only a disposable client key in memory; your Nostr private key stays in the signer.</small>
      <button id="connect-bunker" class="secondary" type="button">Connect remote signer</button>
    </details>
    <section id="workspace-switcher" hidden aria-labelledby="workspace-label">
      <label id="workspace-label" for="workspace">Or use a different workspace</label>
      <select id="workspace" aria-describedby="workspace-status"></select>
      <button id="switch-workspace" class="secondary" type="button">Switch workspace</button>
      <div id="workspace-status" role="status" aria-live="polite"></div>
    </section>
  </section>
</main>
<script src="/signin.js"></script>
</body>
</html>
