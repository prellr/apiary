[package]
name = "apiary-runtime"
description = "Apiary agent runtime: inference providers, routing, spend authority, run loop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
apiary-core = { path = "../apiary-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true
fs2 = "0.4"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
nostr.workspace = true
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
